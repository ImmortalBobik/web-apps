<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dress Up Carter</title>
  <meta name="description" content="Style a 3D CarterPCs in bizarre outfits and get your fit rated">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <a class="back" href="../../">&larr; All apps</a>
      <h1>Dress Up Carter</h1>
      <div class="drip" title="Live score — press “Rate my fit” for the full verdict">
        <div class="drip-text">
          <span class="drip-label">Drip score</span>
          <span class="drip-tier" id="dripTier">Basic</span>
        </div>
        <div class="drip-bar" aria-hidden="true"><div class="drip-fill" id="dripFill"></div></div>
        <strong id="dripNum">0.0</strong>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="stage-tools">
        <div class="seg" role="group" aria-label="Camera">
          <button id="viewFull" aria-pressed="true">Full body</button>
          <button id="viewFace" aria-pressed="false">Face</button>
        </div>
        <button id="spinBtn" class="ghost" aria-pressed="false" title="Turn auto-rotate on or off">⟳ Spin</button>
      </div>
      <p class="stage-hint">Drag to rotate · scroll or pinch to zoom</p>
      <div class="loading" id="loading">Loading Carter…</div>
    </section>

    <aside class="panel">
      <section class="outfit" aria-label="Current outfit">
        <div class="outfit-head">
          <h2>Wearing</h2>
          <button id="undoBtn" class="ghost small" disabled>↶ Undo</button>
        </div>
        <div class="chips" id="outfit"></div>
      </section>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Wardrobe"></nav>
      <p class="hint" id="hint"></p>
      <div class="items" id="items" role="tabpanel"></div>

      <div class="actions">
        <button id="randomBtn">🎲 Random</button>
        <button id="resetBtn">Reset</button>
        <button id="rateBtn" class="primary">⭐ Rate my fit</button>
      </div>
    </aside>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="result" role="dialog" aria-modal="true" aria-labelledby="resTitle">
      <p class="res-kicker">The judges have spoken</p>
      <div class="res-score"><span id="resScore">0.0</span><small>/10</small></div>
      <div class="stars" id="resStars" aria-hidden="true"></div>
      <h2 id="resTitle"></h2>
      <p class="res-quote" id="resQuote"></p>
      <div class="breakdown" id="resBreakdown"></div>
      <div class="combos" id="resCombos"></div>
      <div class="res-actions">
        <button id="closeRes" class="primary">Keep styling</button>
      </div>
    </div>
  </div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
