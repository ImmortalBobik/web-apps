<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Build Battle</title>
  <meta name="description" content="Build the best gaming PC on a budget and get Carter's verdict">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <a class="back" href="../../">&larr; All apps</a>
    <header class="head">
      <div>
        <h1>PC Build Battle</h1>
        <p class="muted">Pick a budget, choose your parts, and see if your build gets Carter's approval.</p>
      </div>
      <div class="budgets" id="budgets" role="group" aria-label="Budget"></div>
    </header>

    <section class="spend card">
      <div class="spend-top"><span>Spent <b id="spent">$0</b> of <b id="budget">$0</b></span><span id="left" class="left"></span></div>
      <div class="bar"><i id="spendBar"></i></div>
    </section>

    <div class="grid">
      <section class="parts" id="parts" aria-label="Parts"></section>

      <aside class="result card" aria-live="polite">
        <div class="score-row">
          <div class="score"><span id="score">0</span><small>/100</small></div>
          <div>
            <h2 id="verdictTitle">Pick some parts</h2>
            <p class="muted" id="verdict">Every slot needs a part before the build can boot.</p>
          </div>
        </div>
        <h3>Estimated FPS</h3>
        <table class="fps">
          <thead><tr><th></th><th>1080p</th><th>1440p</th><th>4K</th></tr></thead>
          <tbody id="fps"></tbody>
        </table>
        <h3>Checks</h3>
        <ul class="checks" id="checks"></ul>
        <div class="actions">
          <button id="randomBtn">🎲 Random build</button>
          <button id="clearBtn">Clear</button>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
