<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Virus Siege</title>
  <meta name="description" content="Survive the malware horde inside Carter's PC — level up, pick upgrades, beat the boss">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="back" href="../../">&larr; All apps</a>
    <h1>Virus Siege</h1>
    <button id="pauseBtn" class="small" aria-label="Pause">⏸</button>
  </header>
  <main class="wrap" id="wrap">
    <canvas id="game" aria-label="Virus Siege game"></canvas>

    <div class="overlay" id="menu">
      <div class="panel">
        <h2 id="mTitle">Virus Siege</h2>
        <p id="mMsg">Malware has breached Carter's PC. Move to dodge — Carter fires automatically. Grab the blue chips to level up and build your loadout. Survive the Ransomware boss.</p>
        <div class="stats" id="mStats" hidden></div>
        <button class="primary" id="playBtn">Start</button>
        <p class="keys">WASD / arrows to move · on phones drag anywhere · P to pause</p>
        <p class="best">Best: <b id="best">—</b></p>
      </div>
    </div>

    <div class="overlay" id="levelUp" hidden>
      <div class="panel wide">
        <h2>Level up!</h2>
        <p>Pick an upgrade</p>
        <div class="cards" id="cards"></div>
      </div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
